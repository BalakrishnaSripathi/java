server:
  port:  9191
spring:
  application:
     name: CUSTOMER-SERVICE
  datasource:
     driver-class-name: com.mysql.cj.jdbc.Driver
     url:  jdbc:mysql://localhost:3306/demo
     username: root
     password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    generate-ddl: true
eureka:
   client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
           default-zone: http://localhost:8761/eureka
   instance:
       hostname: localhost